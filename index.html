    <td class="num">${fmt(k.wert, 0)}</td>
    <td class="num ${cls(k.vs_halten)}">${k.id === "1_halten" || k.vs_halten === null ? "–" : sign(k.vs_halten, 0)}</td></tr>`;
}
document.getElementById("konten").innerHTML = h + "</tbody>";

// Trades
document.getElementById("trades").innerHTML = D.trades.length
  ? `<tbody>` + D.trades.map(x => `<tr><td class="num">${x.zeit}</td><td>${x.konto.replace(/ \(.*\)/, "")}</td><td>${x.art}</td><td class="num">${fmt(x.kurs)} USD</td></tr>`).join("") + "</tbody>"
  : `<tbody><tr><td>Noch keine Trades.</td></tr></tbody>`;

// Grafik
let chart;
function zeichne() {
  if (chart) chart.destroy();
  const ink = css("--muted"), grid = css("--grid");
  chart = new Chart(document.getElementById("verlauf"), {
    type: "line",
    data: { labels: D.verlauf_zeit, datasets: [{ label: "BRNT.L", data: D.verlauf_pct, borderColor: css("--accent"), backgroundColor: css("--accent") }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${sign(c.parsed.y)} % seit Start` } } },
      scales: {
        x: { ticks: { color: ink, maxTicksLimit: 5, maxRotation: 0, font: { family: css("--mono"), size: 10 } }, grid: { display: false } },
        y: { ticks: { color: ink, maxTicksLimit: 5, font: { family: css("--mono"), size: 10 }, callback: v => sign(v, 1) + " %" }, grid: { color: c => c.tick.value === 0 ? css("--muted") : grid }, border: { display: false } }
      },
      elements: { point: { radius: 0, hoverRadius: 4 }, line: { borderWidth: 2, tension: 0 } }
    }
  });
}
if (window.Chart) {
  zeichne();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", zeichne);
  new MutationObserver(zeichne).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}
</script>
</body></html>
